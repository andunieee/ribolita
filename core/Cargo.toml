[package]
name = "ribolita"
version.workspace = true
edition.workspace = true

[features]
default = ["backend-libmdbx"]
backend-libmdbx = ["dep:libmdbx"]
backend-redb = ["dep:redb"]

[dependencies]
wasmtime = "35.0.0"
libmdbx = { version = "0.6", optional = true }
redb = { version = "2", optional = true }
anyhow = { workspace = true }
ribolita_common = { path = "../common" }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
