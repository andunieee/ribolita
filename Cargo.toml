[workspace]
resolver = "2"
members = ["common", "core", "wasm_shared", "examples/*", "cli", "server", "node", "slint_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
rmpv = "1.3.0"
rmp-serde = "1.3.0"
anyhow = "1.0.98"
thiserror = "2.0.12"
log = "0.4"
num_enum = "0.7"
serde_json = "1"
slotmap = "1"
maplit = "1"
chrono = "0.4"
